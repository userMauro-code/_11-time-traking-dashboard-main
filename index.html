<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <script src="./js/app.js" defer></script>
  
  <title>Frontend Mentor | Time tracking dashboard</title>

  
</head>
<body>
  <section class="section">
    <article class=" card__header">
      <div class="card__header--user">
        <img src="./images/image-jeremy.png" alt="">
        <div class="name__user">
          <p>Report for</p>
          <h2>Jeremy Robson</h2>
        </div>
      </div>
      <div class="card__header--buttons">
        <button>Daily</button>
        <button>Weekly</button>
        <button>Monthly</button>
      </div>
    </article>

    <article class="card card__works">
      <img src="./images/icon-work.svg" alt="">
      <div class="card__content">
        <div class="card__content--category">
          <h3>Work</h3>
          <button><img src="./images/icon-ellipsis.svg" alt="button__opcion"></button>
        </div>
        <div class="card__content--data">
          <p class="actual">32hrs</p><!-- weekly -->   
          <p class="previous">Previous - 36hrs</p><!-- weekly -->
        </div>
      </div>
    </article>

    <article class="card card__play">
      <img src="./images/icon-play.svg" alt="">
      <div class="card__content">
        <div class="card__content--category">
          <h3>Play</h3>
          <button><img src="./images/icon-ellipsis.svg" alt=""></button>
        </div>
        <div class="card__content--data">
          <p>10hrs </p><!-- weekly -->
          <p>Previous - 2hrs</p>
        </div>
      </div>
    </article>

    <article class="card card__study">
      <img src="./images/icon-study.svg" alt="">
      <div class="card__content">
        <div class="card__content--category">
          <h3>Estudy</h3>
          <button><img src="./images/icon-ellipsis.svg" alt=""></button>
        </div>
        <div class="card__content--data">
          <p>4hrs </p><!-- weekly -->
          <p>Previous - 7hrs</p>
        </div>
      </div>
    </article>

    <article class="card card__exercise">
      <img src="./images/icon-exercise.svg" alt="">
      <div class="card__content">
        <div class="card__content--category">
          <h3>Exercise</h3>
          <button><img src="./images/icon-ellipsis.svg" alt=""></button>
        </div>
        <div class="card__content--data">
          <p>4hrs </p><!-- weekly -->
          <p>Previous - 5hrs</p>
        </div>
      </div>
    </article>

    <article class="card card__social">
      <img src="./images/icon-social.svg" alt="">
      <div class="card__content">
        <div class="card__content--category">
          <h3>Social</h3>
          <button><img src="./images/icon-ellipsis.svg" alt=""></button>
        </div>
        <div class="card__content--data">
          <p>5hrs </p><!-- weekly -->
          <p>Previous - 10hrs</p>
        </div>
      </div>
    </article>

    <article class="card card__selfCare">
      <img src="./images/icon-self-care.svg" alt="">
      <div class="card__content">
        <div class="card__content--category">
          <h3>Self Care</h3>
          <button><img src="./images/icon-ellipsis.svg" alt=""></button>
        </div>
        <div class="card__content--data">
          <p>2hrs </p><!-- weekly -->
          <p>Previous - 2hrs</p>
        </div>
      </div>
    </article>
  </section>

</body>
</html>
